<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="智账本" />
  <title>智账本 · 双币种个人财务 (MYR / USD)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --primary: #0f766e;
      --primary-ink: #ffffff;
      --accent: #1d4ed8;
      --danger: #dc2626;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding-bottom: 84px;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 14px; }
    .hero {
      background: #0f172a;
      color: #fff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }
    .brand { font-size: 16px; font-weight: 700; }
    .sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .gear-btn {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .sum-box {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
    }
    .sum-label { font-size: 12px; color: #cbd5e1; }
    .sum-val { font-size: 20px; font-weight: 800; margin-top: 4px; }
    .sum-sub { font-size: 11px; color: #94a3b8; margin-top: 4px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .scan-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .scan-btn {
      min-height: 46px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .cam-btn { background: var(--primary); color: #fff; }
    .img-btn { background: #1e293b; color: #fff; }

    .ocr-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      display: none;
    }
    .ocr-box.show { display: block; }
    .preview-img {
      max-width: 100%;
      max-height: 180px;
      border-radius: 10px;
      display: block;
      margin: 8px auto;
      object-fit: contain;
    }
    .ocr-status { font-size: 13px; color: var(--ink); line-height: 1.55; }
    .cand-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .cand-chip {
      min-height: 34px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid #99f6e4;
      background: #f0fdfa;
      color: #0f766e;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .cand-chip.picked {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .type-btn {
      flex: 1;
      min-width: 100px;
      min-height: 44px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--ink);
      border-radius: 11px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .type-btn.active {
      background: var(--primary);
      color: var(--primary-ink);
      border-color: var(--primary);
    }

    .amount-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      color: #fff;
      border-radius: 14px;
      padding: 8px;
      margin-bottom: 10px;
    }
    .curr-btn {
      min-height: 48px;
      padding: 0 12px;
      border-radius: 10px;
      border: none;
      background: #334155;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .amt-input {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      outline: none;
    }
    .save-btn {
      min-height: 48px;
      padding: 0 18px;
      border-radius: 10px;
      border: none;
      background: #10b981;
      color: #052e16;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
    }

    input, select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 0 12px;
      font-size: 15px;
      background: #fff;
      color: var(--ink);
      margin-bottom: 10px;
    }
    .filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    .pill {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .pill.active {
      background: #0f172a;
      color: #fff;
      border-color: #0f172a;
    }
    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .tx-item:last-child { border-bottom: none; }
    .tx-title { font-weight: 700; font-size: 15px; }
    .tx-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .del-btn {
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: var(--danger);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .action-btn {
      min-height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--ink);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .settings-panel {
      display: none;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .settings-panel.show { display: block; }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .stat-row:last-child { border-bottom: none; }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      z-index: 50;
      box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.06);
    }
    .nav-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      padding: 6px 4px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .nav-btn span.ico { font-size: 17px; line-height: 1.1; }
    .nav-btn.active {
      color: var(--primary);
      background: #f0fdfa;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="brand">智账本 · 个人双币种账本</div>
          <div class="sub">纯本地存储 · MYR 日常核算 / USD 投资追踪</div>
        </div>
        <button type="button" class="gear-btn" onclick="switchTab('settings')">⚙ 备份/AI</button>
      </div>
      <div class="summary">
        <div class="sum-box">
          <div class="sum-label">日常收支净额 (MYR)</div>
          <div class="sum-val" id="myrNet">RM 0.00</div>
          <div class="sum-sub" id="myrDetail">支出 RM 0.00 · 收入 RM 0.00</div>
        </div>
        <div class="sum-box">
          <div class="sum-label">投资净投入 (USD)</div>
          <div class="sum-val" id="usdTotal">$ 0.00</div>
          <div class="sum-sub" id="usdCount">共 0 笔投资记录</div>
        </div>
      </div>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <div style="font-weight:700; font-size:14px; margin-bottom:6px;">可选：Gemini Vision 增强识单据</div>
      <div style="font-size:12px; color:var(--muted); margin-bottom:8px;">
        默认用本地 OCR 自动提取金额、店名/品牌与消费项目；填入 Gemini API Key 后可更准确识别多语言单据。Key 仅存本地。
      </div>
      <input type="password" id="geminiKeyInput" placeholder="粘贴 Gemini API Key（可选）" oninput="saveGeminiKey()" />
      <div class="row" style="margin-bottom:0;">
        <button type="button" class="action-btn" onclick="exportJSON()">导出 JSON</button>
        <button type="button" class="action-btn" onclick="exportCSV()">导出 CSV</button>
        <button type="button" class="action-btn" onclick="document.getElementById('importFile').click()">导入 JSON</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;" onchange="importJSON(event)" />
      </div>
    </div>

    <div class="card" id="entryCard">
      <div class="scan-grid">
        <button type="button" class="scan-btn cam-btn" onclick="triggerCapture('camera')">📷 拍照识单据</button>
        <button type="button" class="scan-btn img-btn" onclick="triggerCapture('gallery')">🖼 相册/截图识别</button>
      </div>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="handleImageFile(event)" />
      <input type="file" id="galleryInput" accept="image/*" style="display:none;" onchange="handleImageFile(event)" />

      <div class="ocr-box" id="ocrBox">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong style="font-size:13px;">单据智能识别</strong>
          <button type="button" class="action-btn" style="min-height:28px; padding:0 8px; font-size:12px;" onclick="closeOcrBox()">收起</button>
        </div>
        <img id="previewImg" class="preview-img" alt="单据预览" style="display:none;" />
        <div class="ocr-status" id="ocrStatus">正在识别中...</div>
        <div id="candSection" style="display:none; margin-top:6px;">
          <div style="font-size:12px; color:var(--muted);">点选候选金额填入上方输入框：</div>
          <div class="cand-wrap" id="candList"></div>
        </div>
      </div>

      <div class="row">
        <button type="button" class="type-btn active" data-type="expense" onclick="setType('expense')">日常开销 (MYR)</button>
        <button type="button" class="type-btn" data-type="income" onclick="setType('income')">日常收入 (MYR)</button>
        <button type="button" class="type-btn" data-type="invest" onclick="setType('invest')">投资交易 (USD)</button>
      </div>

      <div class="amount-bar">
        <button type="button" class="curr-btn" id="currBtn" onclick="toggleCurrency()">MYR ⇄</button>
        <input type="number" step="0.01" inputmode="decimal" class="amt-input" id="amountInput" placeholder="0.00" />
        <button type="button" class="save-btn" onclick="addRecord()">保存</button>
      </div>

      <input type="text" id="noteInput" placeholder="店名/品牌 + 消费项目（如：KFC · 炸鸡套餐、美股买入）" />
      <div class="row" style="margin-bottom:0">
        <input type="date" id="dateInput" style="flex:1; margin-bottom:0;" />
        <select id="catInput" style="flex:1; margin-bottom:0;">
          <option value="餐饮">餐饮</option>
          <option value="交通">交通</option>
          <option value="日用/购物">日用/购物</option>
          <option value="账单/杂费">账单/杂费</option>
          <option value="薪资/副业">薪资/副业</option>
          <option value="股票/ETF">股票/ETF</option>
          <option value="期权/其他投资">期权/其他投资</option>
        </select>
      </div>
    </div>

    <div class="card" id="statsCard" style="display:none;">
      <div style="font-weight:700; font-size:15px; margin-bottom:8px;">分类统计</div>
      <div id="statsList"></div>
    </div>

    <div class="card" id="listCard">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <strong>账单明细</strong>
        <span id="recordCount" style="font-size:12px; color:var(--muted);">0 笔</span>
      </div>
      <div class="filter-row">
        <button type="button" class="pill active" data-filter="all" onclick="setFilter('all')">全部</button>
        <button type="button" class="pill" data-filter="expense" onclick="setFilter('expense')">日常开销</button>
        <button type="button" class="pill" data-filter="income" onclick="setFilter('income')">日常收入</button>
        <button type="button" class="pill" data-filter="invest" onclick="setFilter('invest')">投资交易</button>
      </div>
      <div id="txList"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="底部主菜单">
    <button type="button" class="nav-btn active" id="nav-entry" onclick="switchTab('entry')">
      <span class="ico">✍</span>
      <span>记账/识单</span>
    </button>
    <button type="button" class="nav-btn" id="nav-list" onclick="switchTab('list')">
      <span class="ico">🧾</span>
      <span>账单明细</span>
    </button>
    <button type="button" class="nav-btn" id="nav-stats" onclick="switchTab('stats')">
      <span class="ico">📊</span>
      <span>分类统计</span>
    </button>
    <button type="button" class="nav-btn" id="nav-settings" onclick="switchTab('settings')">
      <span class="ico">⚙</span>
      <span>备份/设置</span>
    </button>
  </nav>

  <script>
    const STORAGE_KEY = 'smart_ledger_records_v2';
    const GEMINI_KEY_STORAGE = 'smart_ledger_gemini_key_v1';

    let currentType = 'expense';
    let currentCurrency = 'MYR';
    let currentFilter = 'all';
    let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    document.getElementById('dateInput').valueAsDate = new Date();
    document.getElementById('geminiKeyInput').value = localStorage.getItem(GEMINI_KEY_STORAGE) || '';

    function switchTab(tab) {
      const settingsEl = document.getElementById('settingsPanel');
      const entryEl = document.getElementById('entryCard');
      const statsEl = document.getElementById('statsCard');
      const listEl = document.getElementById('listCard');

      settingsEl.classList.remove('show');
      entryEl.style.display = 'none';
      statsEl.style.display = 'none';
      listEl.style.display = 'none';

      if (tab === 'entry') {
        entryEl.style.display = 'block';
        listEl.style.display = 'block';
      } else if (tab === 'list') {
        listEl.style.display = 'block';
        listEl.scrollIntoView({ behavior: 'smooth' });
      } else if (tab === 'stats') {
        statsEl.style.display = 'block';
        renderStats();
      } else if (tab === 'settings') {
        entryEl.style.display = 'block';
        settingsEl.classList.add('show');
        listEl.style.display = 'block';
      }

      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const activeNav = document.getElementById('nav-' + tab);
      if (activeNav) activeNav.classList.add('active');
    }

    function saveGeminiKey() {
      localStorage.setItem(GEMINI_KEY_STORAGE, document.getElementById('geminiKeyInput').value.trim());
    }

    function setType(type) {
      currentType = type;
      document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === type));
      currentCurrency = type === 'invest' ? 'USD' : 'MYR';
      updateCurrBtn();
    }

    function toggleCurrency() {
      currentCurrency = currentCurrency === 'MYR' ? 'USD' : 'MYR';
      updateCurrBtn();
    }

    function updateCurrBtn() {
      document.getElementById('currBtn').textContent = currentCurrency + ' ⇄';
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.filter === filter));
      render();
    }

    function triggerCapture(mode) {
      const el = document.getElementById(mode === 'camera' ? 'cameraInput' : 'galleryInput');
      el.value = '';
      el.click();
    }

    function closeOcrBox() {
      document.getElementById('ocrBox').classList.remove('show');
    }

    function normalizeAmount(val) {
      if (val === null || val === undefined) return null;
      const cleaned = String(val)
        .replace(/[,，\s]/g, '')
        .replace(/^(RM|MYR|USD|\$|S\$|SGD)/i, '')
        .trim();
      const num = parseFloat(cleaned);
      if (isNaN(num) || num <= 0 || num > 100000000) return null;
      return Number(num.toFixed(2));
    }

    function inferCategoryAndNote(rawText, merchant, itemDesc) {
      const text = `${merchant || ''} ${itemDesc || ''} ${rawText || ''}`.toLowerCase();
      let category = '日用/购物';
      if (/(kfc|mcd|starbucks|kopi|cafe|coffee|tea|restaurant|restoran|food|makan|nasi|chicken|burger|pizza|drink|boba|餐饮|餐|饭|面|咖啡|奶茶|外卖)/i.test(text)) {
        category = '餐饮';
      } else if (/(grab|petronas|shell|caltex|petrol|fuel|parking|touch\s*n\s*go|tng|lrt|mrt|ktm|taxi|toll|油站|打车|停车|过路)/i.test(text)) {
        category = '交通';
      } else if (/(tnb|indah\s*water|water|electric|bill|telco|maxis|celcom|digi|unifi|astro|账单|水费|电费|网费|话费)/i.test(text)) {
        category = '账单/杂费';
      } else if (/(etf|stock|share|dividend|voo|qqqm|smh|aapl|googl|股票|股息|基金)/i.test(text)) {
        category = '股票/ETF';
      } else if (/(option|put|call|spread|期权)/i.test(text)) {
        category = '期权/其他投资';
      }

      const cleanMerchant = (merchant || '').trim();
      const cleanItem = (itemDesc || '').trim();
      let note = '';
      if (cleanMerchant && cleanItem && cleanMerchant.toLowerCase() !== cleanItem.toLowerCase()) {
        note = `${cleanMerchant} · ${cleanItem}`;
      } else {
        note = cleanMerchant || cleanItem || category;
      }
      return { category, note: note.slice(0, 60) };
    }

    function extractDetailsFromText(rawText) {
      const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const totalKeywords = /(grand\s*total|total\s*amount|order\s*total|net\s*amount|amount\s*due|jumlah\s*perlu\s*dibayar|jumlah|total|合计|应付|实付|总额|结算)/i;
      const ignoreKeywords = /(subtotal|sub-total|tax|sst|gst|service\s*charge|rounding|change|discount|voucher|cash|card|invoice|receipt\s*no|order\s*id|qty|数量|单价|找零|税|折扣)/i;

      const scored = [];
      lines.forEach((line, idx) => {
        if (ignoreKeywords.test(line) && !totalKeywords.test(line)) return;
        const matches = line.match(/(?:RM|MYR|\$)?\s*\d{1,3}(?:,\d{3})*(?:\.\d{1,2})|\b\d+\.\d{2}\b/gi) || [];
        matches.forEach(m => {
          const amt = normalizeAmount(m);
          if (!amt) return;
          const hasDecimal = /\.\d{1,2}$/.test(m.trim());
          const hasCurrency = /(?:RM|MYR|\$)/i.test(m);
          if (!hasDecimal && !hasCurrency && !totalKeywords.test(line)) return;

          let score = hasDecimal ? 10 : 3;
          if (hasCurrency) score += 15;
          if (totalKeywords.test(line)) score += 40;
          if (idx >= lines.length - 6) score += 8;
          scored.push({ amount: amt, score, line });
        });
      });

      scored.sort((a, b) => b.score - a.score);
      const uniqueAmounts = [];
      for (const item of scored) {
        if (!uniqueAmounts.includes(item.amount)) uniqueAmounts.push(item.amount);
        if (uniqueAmounts.length >= 6) break;
      }

      // 抓店名/品牌（通常在靠前几行，排除纯数字、日期、电话、发票号、地址/税号词）
      const skipMerchant = /^(tax\s*invoice|invoice|receipt|resit|welcome|thank\s*you|tel|phone|sst|reg\s*no|roc|order|date|time|table|cashier|subtotal|total|qty|\d+[-/.]\d+)/i;
      let merchant = '';
      for (let i = 0; i < Math.min(lines.length, 8); i++) {
        const l = lines[i];
        if (l.length < 2 || l.length > 45) continue;
        if (skipMerchant.test(l)) continue;
        if (/^[\d\s.,:/\-()]+$/.test(l)) continue;
        if (/^(rm|myr|usd|\$)\s*\d/i.test(l)) continue;
        merchant = l.replace(/\s{2,}/g, ' ');
        break;
      }

      // 抓消费项目（优先找带金额的商品行或非合计/非杂项的文字行）
      let itemDesc = '';
      for (const line of lines) {
        if (line === merchant) continue;
        if (totalKeywords.test(line) || ignoreKeywords.test(line)) continue;
        if (skipMerchant.test(line)) continue;
        const cleanedLine = line
          .replace(/(?:RM|MYR|\$)?\s*\d{1,3}(?:,\d{3})*(?:\.\d{1,2})/gi, '')
          .replace(/^\d+\s*[xX*]\s*/, '')
          .trim();
        if (cleanedLine.length >= 2 && cleanedLine.length <= 40 && !/^[\d\s.,:/\-()]+$/.test(cleanedLine)) {
          itemDesc = cleanedLine.replace(/\s{2,}/g, ' ');
          break;
        }
      }

      let detectedCurrency = null;
      if (/\b(?:RM|MYR)\b/i.test(rawText)) detectedCurrency = 'MYR';
      else if (/\bUSD\b/i.test(rawText) || /\$\s*\d/.test(rawText)) detectedCurrency = 'USD';

      let detectedDate = null;
      const isoMatch = rawText.match(/\b(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})\b/);
      if (isoMatch) {
        detectedDate = `${isoMatch[1]}-${isoMatch[2].padStart(2, '0')}-${isoMatch[3].padStart(2, '0')}`;
      } else {
        const dmyMatch = rawText.match(/\b(\d{1,2})[-/](\d{1,2})[-/](20\d{2})\b/);
        if (dmyMatch) {
          detectedDate = `${dmyMatch[3]}-${dmyMatch[2].padStart(2, '0')}-${dmyMatch[1].padStart(2, '0')}`;
        }
      }

      const inferred = inferCategoryAndNote(rawText, merchant, itemDesc);

      return {
        bestAmount: uniqueAmounts[0] || null,
        candidates: uniqueAmounts,
        bestLine: scored[0]?.line || '',
        detectedCurrency,
        detectedDate,
        merchant,
        itemDesc,
        category: inferred.category,
        note: inferred.note
      };
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function callGeminiVision(dataUrl, apiKey) {
      const match = dataUrl.match(/^data:(image\/[a-zA-Z0-9+.-]+);base64,(.+)$/);
      if (!match) throw new Error('图片格式无效');
      const mimeType = match[1];
      const base64Data = match[2];

      const prompt = `你是专业单据与交易截图识别助手。请从图片中提取：
1. amount: 最终结算金额（数字，优先 Total / Grand Total / Net Amount / Amount Due / Jumlah Perlu Dibayar / 实付 / 合计，排除税费/找零/折扣/单价/单号）
2. currency: "MYR" 或 "USD"
3. date: "YYYY-MM-DD"（若无法确定则空字符串）
4. merchant: 消费所在店铺、品牌或平台名称（如 KFC、Starbucks、Grab、Moomoo）
5. item: 消费内容/商品摘要（如 炸鸡套餐、拿铁、打车、买股）
6. category: 只能从以下之一选择：["餐饮","交通","日用/购物","账单/杂费","薪资/副业","股票/ETF","期权/其他投资"]
7. matchedLine: 匹配金额的那一行原文
8. candidates: 候选金额数字数组

请只返回严格 JSON：
{"amount": 12.50, "currency": "MYR", "date": "2026-11-28", "merchant": "店名", "item": "消费项目", "category": "餐饮", "matchedLine": "TOTAL RM 12.50", "candidates": [12.50, 10.00]}`;

      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: mimeType, data: base64Data } }
              ]
            }],
            generationConfig: { responseMimeType: 'application/json' }
          })
        }
      );
      if (!res.ok) throw new Error('Gemini 请求失败 (' + res.status + ')');
      const json = await res.json();
      const text = json?.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
      const parsed = JSON.parse(text);
      const inferred = inferCategoryAndNote(text, parsed.merchant, parsed.item);
      return {
        amount: parsed.amount,
        candidates: parsed.candidates,
        currency: parsed.currency,
        date: parsed.date,
        merchant: parsed.merchant || '',
        itemDesc: parsed.item || '',
        category: parsed.category || inferred.category,
        note: inferred.note,
        matchedLine: parsed.matchedLine || ''
      };
    }

    function applyRecognizedData(data) {
      const amt = normalizeAmount(data.amount);
      const cands = Array.isArray(data.candidates)
        ? data.candidates.map(normalizeAmount).filter(Boolean)
        : [];
      const mergedCands = amt ? [amt, ...cands.filter(x => x !== amt)] : cands;

      if (data.currency === 'MYR' || data.currency === 'USD') {
        if (data.currency === 'USD' && currentType !== 'invest') {
          setType('invest');
        } else if (data.currency === 'MYR' && currentType === 'invest') {
          setType('expense');
        } else {
          currentCurrency = data.currency;
          updateCurrBtn();
        }
      }

      if (data.date && /^\d{4}-\d{2}-\d{2}$/.test(data.date)) {
        document.getElementById('dateInput').value = data.date;
      }

      const validCategories = ['餐饮', '交通', '日用/购物', '账单/杂费', '薪资/副业', '股票/ETF', '期权/其他投资'];
      if (data.category && validCategories.includes(data.category)) {
        document.getElementById('catInput').value = data.category;
      }

      if (data.note) {
        document.getElementById('noteInput').value = data.note;
      }

      if (amt) {
        document.getElementById('amountInput').value = amt.toFixed(2);
      }

      const currPrefix = currentCurrency === 'MYR' ? 'RM ' : '$ ';
      const statusEl = document.getElementById('ocrStatus');
      statusEl.innerHTML = [
        amt ? `金额：<strong>${currPrefix}${amt.toFixed(2)}</strong>` : '金额：未能自动锁定，请点选下方候选或手动输入',
        data.merchant ? `店名/品牌：<strong>${escapeHtml(data.merchant)}</strong>` : '店名/品牌：未明显识别',
        `消费/分类：<strong>${escapeHtml(data.itemDesc || data.note || '-')}</strong>（${escapeHtml(document.getElementById('catInput').value)}）`,
        data.matchedLine ? `<span style="color:#64748b; font-size:12px;">匹配行：${escapeHtml(data.matchedLine)}</span>` : ''
      ].filter(Boolean).join('<br>');

      const candSection = document.getElementById('candSection');
      const candList = document.getElementById('candList');
      if (mergedCands.length) {
        candSection.style.display = 'block';
        candList.innerHTML = mergedCands.map(v => {
          const isPicked = amt === v;
          return `<button type="button" class="cand-chip ${isPicked ? 'picked' : ''}" onclick="pickCandidate(${v})">${v.toFixed(2)}</button>`;
        }).join('');
      } else {
        candSection.style.display = 'none';
      }
    }

    function pickCandidate(val) {
      document.getElementById('amountInput').value = Number(val).toFixed(2);
      document.querySelectorAll('.cand-chip').forEach(btn => {
        btn.classList.toggle('picked', parseFloat(btn.textContent) === Number(val));
      });
    }

    async function handleImageFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const ocrBox = document.getElementById('ocrBox');
      const previewImg = document.getElementById('previewImg');
      const statusEl = document.getElementById('ocrStatus');
      document.getElementById('candSection').style.display = 'none';
      ocrBox.classList.add('show');

      const dataUrl = await fileToDataURL(file);
      previewImg.src = dataUrl;
      previewImg.style.display = 'block';

      const apiKey = (document.getElementById('geminiKeyInput').value || '').trim();
      try {
        if (apiKey) {
          statusEl.textContent = '正在使用 Gemini Vision 识别金额、店名与消费内容...';
          const aiRes = await callGeminiVision(dataUrl, apiKey);
          applyRecognizedData(aiRes);
          return;
        }
      } catch (err) {
        statusEl.textContent = `AI 识别未成功（${err.message}），正在切换本地 OCR...`;
      }

      try {
        if (typeof Tesseract === 'undefined') {
          statusEl.textContent = '离线 OCR 组件加载中或网络受限，请手动填写。';
          return;
        }
        statusEl.textContent = '正在本地 OCR 识别单据金额、店名与项目...';
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(dataUrl);
        await worker.terminate();
        const parsed = extractDetailsFromText(ret.data.text || '');
        applyRecognizedData({
          amount: parsed.bestAmount,
          candidates: parsed.candidates,
          currency: parsed.detectedCurrency,
          date: parsed.detectedDate,
          merchant: parsed.merchant,
          itemDesc: parsed.itemDesc,
          category: parsed.category,
          note: parsed.note,
          matchedLine: parsed.bestLine
        });
      } catch (e) {
        statusEl.textContent = '单据识别失败，请直接在表单中输入。';
      }
    }

    function addRecord() {
      const amt = parseFloat(document.getElementById('amountInput').value);
      if (isNaN(amt) || amt <= 0) {
        alert('请输入大于 0 的金额');
        return;
      }
      const item = {
        id: Date.now(),
        type: currentType,
        currency: currentCurrency,
        amount: Number(amt.toFixed(2)),
        note: document.getElementById('noteInput').value.trim() || document.getElementById('catInput').value,
        category: document.getElementById('catInput').value,
        date: document.getElementById('dateInput').value || new Date().toISOString().slice(0, 10)
      };
      records.unshift(item);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      document.getElementById('amountInput').value = '';
      document.getElementById('noteInput').value = '';
      render();
    }

    function deleteRecord(id) {
      records = records.filter(r => r.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      render();
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ledger-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportCSV() {
      const header = ['id', 'date', 'type', 'currency', 'amount', 'category', 'note'];
      const rows = records.map(r =>
        header.map(k => `"${String(r[k] ?? '').replace(/"/g, '""')}"`).join(',')
      );
      const csv = '\uFEFF' + [header.join(','), ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ledger-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!Array.isArray(parsed)) throw new Error('格式错误');
          records = parsed;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
          render();
          alert(`已导入 ${records.length} 条记录`);
        } catch (err) {
          alert('导入失败：请确认选择的是有效的 JSON 备份文件');
        }
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function renderStats() {
      const statsEl = document.getElementById('statsList');
      if (!records.length) {
        statsEl.innerHTML = '<div class="tx-meta">暂无记录可统计。</div>';
        return;
      }
      const map = {};
      records.forEach(r => {
        const key = `${r.category} (${r.currency})`;
        map[key] = (map[key] || 0) + Number(r.amount);
      });
      const rows = Object.entries(map).sort((a, b) => b[1] - a[1]);
      statsEl.innerHTML = rows.map(([k, v]) => {
        const prefix = k.includes('(MYR)') ? 'RM ' : '$ ';
        return `<div class="stat-row"><span>${escapeHtml(k)}</span><strong>${prefix}${v.toFixed(2)}</strong></div>`;
      }).join('');
    }

    function render() {
      let myrExpense = 0;
      let myrIncome = 0;
      let usdInvest = 0;
      let usdCount = 0;

      records.forEach(r => {
        if (r.currency === 'MYR') {
          if (r.type === 'income') myrIncome += r.amount;
          else myrExpense += r.amount;
        } else {
          usdInvest += r.amount;
          usdCount += 1;
        }
      });

      const myrNet = myrIncome - myrExpense;
      document.getElementById('myrNet').textContent = 'RM ' + myrNet.toFixed(2);
      document.getElementById('myrDetail').textContent =
        `支出 RM ${myrExpense.toFixed(2)} · 收入 RM ${myrIncome.toFixed(2)}`;
      document.getElementById('usdTotal').textContent = '$ ' + usdInvest.toFixed(2);
      document.getElementById('usdCount').textContent = `共 ${usdCount} 笔投资记录`;

      const filtered = currentFilter === 'all'
        ? records
        : records.filter(r => r.type === currentFilter);

      document.getElementById('recordCount').textContent = `${filtered.length} 笔`;

      const listEl = document.getElementById('txList');
      if (!filtered.length) {
        listEl.innerHTML = '<div class="tx-meta">当前筛选下还没有记录，可以拍照识单据或手动记一笔。</div>';
      } else {
        listEl.innerHTML = filtered.map(r => {
          const sign = r.type === 'expense' ? '-' : '+';
          const prefix = r.currency === 'MYR' ? 'RM ' : '$ ';
          const typeLabel = r.type === 'expense' ? '开销' : (r.type === 'income' ? '收入' : '投资');
          return `
            <div class="tx-item">
              <div>
                <div class="tx-title">${escapeHtml(r.note)}</div>
                <div class="tx-meta">${escapeHtml(r.date)} · ${escapeHtml(r.category)} · ${typeLabel} (${r.currency})</div>
              </div>
              <div style="display:flex; align-items:center; gap:8px;">
                <strong>${sign}${prefix}${Number(r.amount).toFixed(2)}</strong>
                <button type="button" class="del-btn" onclick="deleteRecord(${r.id})">删</button>
              </div>
            </div>
          `;
        }).join('');
      }

      if (document.getElementById('statsCard').style.display !== 'none') {
        renderStats();
      }
    }

    render();
  </script>
</body>
</html>
