<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="智账本" />
  <title>智账本 · 双币种个人财务 (MYR / USD)</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --primary: #0f766e;
      --primary-ink: #ffffff;
      --accent: #1d4ed8;
      --danger: #dc2626;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding-bottom: 84px;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 14px; }
    .hero {
      background: #0f172a;
      color: #fff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }
    .brand { font-size: 16px; font-weight: 700; }
    .sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .gear-btn {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .sum-box {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
    }
    .sum-label { font-size: 12px; color: #cbd5e1; }
    .sum-val { font-size: 20px; font-weight: 800; margin-top: 4px; }
    .sum-sub { font-size: 11px; color: #94a3b8; margin-top: 4px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .scan-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .scan-btn {
      min-height: 46px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .cam-btn { background: var(--primary); color: #fff; }
    .img-btn { background: #1e293b; color: #fff; }

    .ocr-box {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      display: none;
    }
    .ocr-box.show { display: block; }
    .preview-img {
      max-width: 100%;
      max-height: 180px;
      border-radius: 10px;
      display: block;
      margin: 8px auto;
      object-fit: contain;
    }
    .ocr-status { font-size: 13px; color: var(--ink); line-height: 1.55; }
    .cand-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .cand-chip {
      min-height: 34px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid #99f6e4;
      background: #f0fdfa;
      color: #0f766e;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .cand-chip.picked {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .type-btn {
      flex: 1;
      min-width: 100px;
      min-height: 44px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--ink);
      border-radius: 11px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .type-btn.active {
      background: var(--primary);
      color: var(--primary-ink);
      border-color: var(--primary);
    }

    .amount-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      color: #fff;
      border-radius: 14px;
      padding: 8px;
      margin-bottom: 10px;
    }
    .curr-btn {
      min-height: 48px;
      padding: 0 12px;
      border-radius: 10px;
      border: none;
      background: #334155;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .amt-input {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      outline: none;
    }
    .save-btn {
      min-height: 48px;
      padding: 0 18px;
      border-radius: 10px;
      border: none;
      background: #10b981;
      color: #052e16;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
    }

    input, select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 0 12px;
      font-size: 15px;
      background: #fff;
      color: var(--ink);
      margin-bottom: 10px;
    }
    .filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    .pill {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .pill.active {
      background: #0f172a;
      color: #fff;
      border-color: #0f172a;
    }
    .tx-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .tx-item:last-child { border-bottom: none; }
    .tx-title { font-weight: 700; font-size: 15px; }
    .tx-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .del-btn {
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: var(--danger);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .action-btn {
      min-height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--ink);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .settings-panel {
      display: none;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .settings-panel.show { display: block; }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .stat-row:last-child { border-bottom: none; }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
